name: Build Desktop App

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web Export
        run: npx expo export -p web

      - name: Create Electron Launcher
        run: |
          Set-Content -Path main.js -Value "const {app, BrowserWindow} = require('electron'); const path = require('path'); function createWindow() { const win = new BrowserWindow({ width: 1200, height: 800 }); win.loadFile(path.join(__dirname, 'dist/index.html')); } app.whenReady().then(createWindow);"
          Add-Content -Path package.json -Value "`n`"

      - name: Install Electron & Builder
        run: npm install electron electron-builder --save-dev

      - name: Package Windows App
        run: npx electron-builder --win --x64 --dir
