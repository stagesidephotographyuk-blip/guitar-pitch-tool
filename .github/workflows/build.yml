name: Build Desktop App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Build Web Export
        run: npx expo export -p web

      - name: Package to Desktop
        uses: tavdata/setup-nativefier-action@v1
        with:
          url: 'file:///${{ github.workspace }}/dist/index.html'
          name: 'GuitarPitchTool'
          width: '1200'
          height: '800'
