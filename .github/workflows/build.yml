name: Build Desktop App

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web Export
        run: npx expo export -p web

      - name: Create Launcher Script
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('main.js', \"const {app, BrowserWindow} = require('electron'); function createWindow() { const win = new BrowserWindow({ width: 1200, height: 800 }); win.loadFile('dist/index.html'); } app.whenReady().then(createWindow);\");"

      - name: Install Electron & Builder
        run: npm install electron electron-builder --save-dev

      - name: Build Windows Executable
        run: npx electron-builder --win --x64 --dir
